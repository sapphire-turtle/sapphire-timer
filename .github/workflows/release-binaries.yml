name: Release binaries

# Builds the headless edition's and the desktop app's binaries for the four release
# platforms and attaches them to an existing `v{version}` release, which the
# two share. release-plz.yml calls it after a release; run it by hand to
# (re)upload the files for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach binaries to (e.g. v0.2.0).'
        required: true
        type: string

jobs:
  # Both binaries are `sapphire-timer` on PATH; the files are named by crate
  # to tell them apart.
  headless:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-timer-headless
      binary: sapphire-timer
      asset: sapphire-timer-headless
      # rustls pulls aws-lc-sys, which builds with cmake.
      linux-packages: cmake

  desktop:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-timer-desktop
      binary: sapphire-timer-desktop
      # eframe -> winit needs xkbcommon and the X11 and Wayland client
      # libraries even to build; cmake is for aws-lc-sys.
      linux-packages: >-
        pkg-config cmake libxkbcommon-dev libwayland-dev libx11-dev
        libxcursor-dev libxi-dev libxrandr-dev

  # Sapphire Timer as a package (#25, #33), with sapphire-turtle/.github's
  # release-packager.yml: an installer per desktop OS, each signed with the organization's
  # minisign key, and the feed `sapphire-timer-latest.json` the installed app updates itself
  # from (desktop/src/package.rs reads this repository's latest release). The package holds
  # the desktop binary only, which runs the CLI too; the bare binaries above stay for
  # servers, the install script and `cargo binstall`.
  package:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-packager.yml@v1
    # The signing key, and the macOS signing secrets.
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-timer-desktop
      app-name: sapphire-timer
      features: package
      console-bin: sapphire-timer-console
      # One binary: the app server is its `serve` subcommand.
      command: sapphire-timer
      # The X11 client libraries for winit; cmake is for aws-lc-sys.
      linux-packages: >-
        pkg-config cmake libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      # The icons [package.metadata.packager] names, rendered from the app's SVG.
      pre-package: cargo run --release --locked -p sapphire-timer-desktop --example icons -- "$CRATE_DIR/icons"
