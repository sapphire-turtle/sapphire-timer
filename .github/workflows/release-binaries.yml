name: Release binaries

# Builds a binary for the four release platforms and attaches it to an existing
# release. release-plz.yml calls it after a release; run it by hand to
# (re)upload the files for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      target:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach binaries to (e.g. v0.1.0 or desktop-v0.1.0).'
        required: true
        type: string
      target:
        required: true
        type: choice
        options: [cli, desktop]

jobs:
  cli:
    if: inputs.target == 'cli'
    permissions:
      contents: write
    uses: sapphire-turtle/sapphire-framework/.github/workflows/shared-release-binary.yml@main
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-timer
      binary: sapphire-timer
      # rustls pulls aws-lc-sys, which builds with cmake.
      linux-packages: cmake

  desktop:
    if: inputs.target == 'desktop'
    permissions:
      contents: write
    uses: sapphire-turtle/sapphire-framework/.github/workflows/shared-release-binary.yml@main
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-timer-desktop
      binary: sapphire-timer-desktop
      # eframe -> winit needs xkbcommon and the X11 and Wayland client
      # libraries even to build.
      linux-packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev
        libxcursor-dev libxi-dev libxrandr-dev
