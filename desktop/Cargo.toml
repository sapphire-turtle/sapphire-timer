[package]
name = "sapphire-timer-desktop"
# Released together with `sapphire-timer-headless`, under its `v{version}`
# tags (release-plz.toml).
version = "0.2.0"
edition.workspace = true
description = "Desktop GUI for sapphire-timer"
license-file = "LICENSE"
repository.workspace = true
publish = false

[dependencies]
# Every command but the window — `serve`, `mcp`, `status`, … — runs the CLI's
# own code, so this one binary does all the CLI does.
sapphire-timer-cli = { path = "../crates/sapphire-timer-cli", version = "0.2.0" }
# `eframe`: `gui::app::run` starts the window, and `gui::{eframe, egui}` are the
# versions it renders with.
sapphire-framework = { workspace = true, features = ["eframe", "ipc"] }
# The record types the server's answers deserialize into, and the methods'
# parameters and names. No store: the window reads nothing from disk.
sapphire-timer-core = { path = "../crates/sapphire-timer-core", version = "0.1.0", default-features = false }
sapphire-timer-mcp = { path = "../crates/sapphire-timer-mcp", version = "0.1.0", default-features = false }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
grain-id.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
# The real server, for the client test: `sapphire_timer_server::server()`.
sapphire-timer-server = { path = "../crates/sapphire-timer-server", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# `cargo binstall --git https://github.com/sapphire-turtle/sapphire-timer sapphire-timer-desktop`
# downloads the release file instead of building it (this crate is not on crates.io), following
# sapphire-turtle/.github's README.md#conventions: the files are bare binaries named
# `<binary>-<os>-<arch>`, so each release platform names its own. They are attached to the
# `v{version}` release it shares with `sapphire-timer-headless`. quick-install is a third
# party's build: only this repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"
