[package]
name = "sapphire-timer-cli"
# Released together with the two editions that run it, `sapphire-timer-headless`
# and `sapphire-timer-desktop` (release-plz.toml).
version = "0.2.0"
edition.workspace = true
description = "The command line of sapphire-timer's two editions, the headless one and the desktop app: the framework's commands, which run the app server or call it"
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities"]
keywords = ["timer", "pomodoro", "cli", "mcp"]

[features]
default = ["redb-store"]
redb-store = [
    "sapphire-timer-core/redb-store",
    "sapphire-timer-server/redb-store",
    "sapphire-framework/redb-store",
]

[dependencies]
sapphire-timer-core = { path = "../sapphire-timer-core", version = "0.1.0", default-features = false }
sapphire-timer-server = { path = "../sapphire-timer-server", version = "0.2.0", default-features = false }
sapphire-framework = { workspace = true, features = ["server", "ipc", "mcp"] }
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
